<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>House plan — 24 × 42 ft</title>
<style>
:root{ --ink:#22262c; --ink2:#667080; --line:#ddd8cf; --bg:#f3f1ec; --panel:#fff;
       --accent:#9a5b23; --warn:#b3401f; --ok:#2f7350; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:13px/1.45 "Segoe UI",Roboto,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;
       background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0}
header h1 small{font-weight:400;color:var(--ink2);margin-left:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fbfaf7;padding:6px 13px;
            font:inherit;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.btn{border:1px solid var(--line);background:#fbfaf7;border-radius:5px;padding:6px 11px;
     font:inherit;cursor:pointer;color:var(--ink)}
.btn:hover,.seg button:hover:not(.on){background:#eee9e0}
.spacer{flex:1}
main{display:flex;flex-wrap:wrap;gap:14px;padding:14px 16px;align-items:flex-start}
#draw{flex:1 1 560px;min-width:0;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;
       flex:1 1 380px;max-width:640px}
.sheet.wide{max-width:980px;padding:16px 18px}
.sheet svg{display:block;width:100%;height:auto}
.sheet img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:4px}
#side{flex:0 1 400px;min-width:300px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:11px 12px}
.card h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);margin:0 0 8px}
.sum div{display:flex;justify-content:space-between;padding:1.5px 0}
.sum b{font-variant-numeric:tabular-nums}
.sum .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:5px}
.chk{margin-top:8px;padding:6px 9px;border-radius:4px;font-size:12px}
.chk.ok{background:#e6f1ea;color:var(--ok)}
.chk.bad{background:#f8e7e0;color:var(--warn)}
ul.notes{margin:0;padding-left:17px}
ul.notes li{margin-bottom:5px}
.hint{color:var(--ink2);font-size:11.5px;margin:6px 0 0}
.rl h3{font-size:11px;margin:8px 0 4px;color:var(--ink2);font-weight:600}
.rl h3:first-child{margin-top:0}
.rl .list{display:flex;flex-wrap:wrap;gap:5px}
.rl button{border:1px solid var(--line);background:#fbfaf7;border-radius:4px;padding:4px 9px;
           font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
.rl button:hover{background:#eee9e0}
.rl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.detail{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.detail .pic{flex:1 1 380px;min-width:0;max-width:560px;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.detail .facts{flex:1 1 300px;min-width:260px}
.detail h2{font-size:19px;margin:0 0 2px}
.detail .where{color:var(--ink2);margin-bottom:12px}
.facts table{border-collapse:collapse;width:100%}
.facts th{text-align:left;font-weight:600;color:var(--ink2);padding:5px 12px 5px 0;vertical-align:top;
          white-space:nowrap;font-size:12px;border-top:1px solid #eeeae2}
.facts td{padding:5px 0;border-top:1px solid #eeeae2}
.facts tr:first-child th,.facts tr:first-child td{border-top:0}
.facts ul{margin:0;padding-left:16px}
.facts li{margin-bottom:3px}
/* ---- phones ---- */
@media (max-width:640px){
  header{position:static;padding:8px 10px;gap:8px}
  header h1{flex:1;order:1;font-size:14px}
  header h1 small{display:none}
  #side{min-width:0;flex-basis:100%}
  .detail .facts{min-width:0}
  header .spacer{display:none}
  #png{order:2;padding:5px 9px;font-size:12px}
  #views{order:3;flex:1 1 100%}
  #views button{flex:1 1 auto;white-space:nowrap;padding:8px 4px;font-size:12.5px}
  main{padding:10px;gap:10px}
  .sheet{padding:6px}
  .sheet.wide{padding:10px}
  .detail{gap:12px}
  .rl button{padding:7px 11px;font-size:13px}
}
</style>
</head>
<body>

<header>
  <h1>House plan <small id="sub"></small></h1>
  <div class="seg" id="views"></div>
  <div class="spacer"></div>
  <button class="btn" id="png">Save as picture (PNG)</button>
</header>

<main>
  <div id="draw"></div>
  <div id="side">
    <div class="card"><h2>Room details</h2><div class="rl" id="rooms"></div>
      <p class="hint">Pick a room here, or click it on the plan, to see it on its own.</p></div>
    <div class="card"><h2>Areas and checks</h2><div id="sum"></div></div>
    <div class="card"><h2>Open points</h2><ul class="notes" id="notes"></ul></div>
  </div>
</main>

<script>
/* ==========================================================================
   THE PLAN DATA  --  this block is the design.  Everything below it only draws.
   Feet throughout.  X: 0..24 left to right.  Y: 0 = street, 42 = rear.
   Room rectangles run to wall centre lines; clear sizes are worked out from
   the wall thickness below.
   Room types: room | wet | stair | porch | balcony | open
   "under": true  = a space under (or a stair over) another, drawn dashed on top.
   Openings: k = door | win | gate | open | rail
             ax 'h' = wall running left-right at Y = at
             ax 'v' = wall running front-back at X = at
             s  = which side a door swings to (+1 = towards rear / right)
             j  = the two spaces the opening joins
   ========================================================================== */
const STAIR = (front) => [
  { n:'Lobby',      t:'stair', x0:0, y0:front, x1:4, y1:3 },
  { n:'Side stair', t:'stair', x0:0, y0:3,     x1:4, y1:10.5, treads:10, dir:'+Y' },
  { n:'Landing',    t:'stair', x0:0, y0:10.5,  x1:4, y1:14 }
];
const BACK = (front, court) => [
  { n:'Drawing room', t:'room', x0:13, y0:front, x1:24, y1:14 },
  { n:'Kitchen',      t:'room', x0:0,  y0:14,    x1:8,  y1:24.5 },
  { n:'Lounge',       t:'room', x0:8,  y0:14,    x1:24, y1:24.5 },
  { n:'Bedroom 1',    t:'room', x0:0,  y0:24.5,  x1:12, y1:36 },
  { n:'Bedroom 2',    t:'room', x0:12, y0:24.5,  x1:24, y1:36 },
  { n:'Bath A',       t:'wet',  x0:0,  y0:36,  x1:7,  y1:42 },
  { n:court,          t:'open', x0:7,  y0:36,  x1:17, y1:42 },
  { n:'Bath B',       t:'wet',  x0:17, y0:36,  x1:24, y1:42 }
];
/* openings that are the same on both floors; P = porch on ground, balcony above */
const INNER = (front, P, E, court, under) => [
  { k:'door', ax:'v', at:4,    from:0.65, to:2.9,  s:1,  j:['Lobby', P] },
  { k:'door', ax:'h', at:14,   from:9.5,  to:12.5, s:1,  j:[E, 'Lounge'], label:'Main door' },
  { k:'win',  ax:'h', at:14,   from:5,    to:7.5,        j:['Kitchen', under] },
  { k:'door', ax:'v', at:13,   from:3,    to:6,    s:1,  j:[P, 'Drawing room'] },
  { k:'door', ax:'h', at:14,   from:14,   to:17,   s:-1, j:['Drawing room', 'Lounge'] },
  { k:'open', ax:'v', at:8,    from:14.5, to:20,         j:['Kitchen', 'Lounge'], label:'Counter opening' },
  { k:'door', ax:'h', at:24.5, from:8.5,  to:11.5, s:1,  j:['Lounge', 'Bedroom 1'] },
  { k:'door', ax:'h', at:24.5, from:12.5, to:15.5, s:1,  j:['Lounge', 'Bedroom 2'] },
  { k:'door', ax:'h', at:36, from:0.7,  to:2.95, s:1,  j:['Bedroom 1', 'Bath A'] },     // in the corner, against the boundary wall
  { k:'win',  ax:'h', at:front,from:15,   to:22,         j:['Drawing room', 'the lane'] },
  { k:'win',  ax:'h', at:36, from:8,    to:11,         j:['Bedroom 1', court] },
  { k:'win',  ax:'v', at:7,    from:39.6, to:41,         j:['Bath A', court], label:'Ventilator' }
];
/* toilets, basin and shower.  f = the way the fixture faces */
const BATH_A = [
  { r:'Bath A', k:'platform', x0:0.58, y0:39.0,  x1:6.71, y1:41.42 },
  { r:'Bath A', k:'asian',    x0:1.0,  y0:39.3,  x1:3.0,  y1:41.3,  f:'-Y' },
  { r:'Bath A', k:'commode',  x0:4.9,  y0:39.15, x1:6.4,  y1:41.42, f:'-Y' },
  { r:'Bath A', k:'basin',    x0:3.1,  y0:36.21, x1:4.35, y1:37.25, f:'+Y' },
  { r:'Bath A', k:'shower',   x0:4.5,  y0:36.21, x1:6.71, y1:39.0 }
];
const BATH_B = [
  { r:'Bath B', k:'platform', x0:17.29, y0:39.0,  x1:23.42, y1:41.42 },
  { r:'Bath B', k:'asian',    x0:18.3,  y0:39.3,  x1:20.3,  y1:41.3,  f:'-Y' },
  { r:'Bath B', k:'commode',  x0:21.6,  y0:39.15, x1:23.1,  y1:41.42, f:'-Y' },
  { r:'Bath B', k:'basin',    x0:19.85, y0:36.21, x1:21.1,  y1:37.25, f:'+Y' },
  { r:'Bath B', k:'shower',   x0:21.2,  y0:36.21, x1:23.42, y1:39.0 }
];

/* furniture.  f = the way the piece faces (a bed's foot, a sofa's seat, a wardrobe's doors).
   "front" is the Y of the front wall, which is 1 ft further out on the first floor. */
const FURNITURE = (front) => [
  /* Bedroom 1: bed on the right wall, wardrobe on the left wall clear of the bath door */
  { r:'Bedroom 1', k:'bed',      x0:5.29,  y0:28.6,  x1:11.79, y1:33.6,  f:'-X' },
  { r:'Bedroom 1', k:'side',     x0:10.3,  y0:27.4,  x1:11.79, y1:28.6 },
  { r:'Bedroom 1', k:'side',     x0:10.3,  y0:33.6,  x1:11.79, y1:34.8 },
  { r:'Bedroom 1', k:'wardrobe', x0:0.58,  y0:25.0,  x1:2.58,  y1:31.0,  f:'+X' },
  { r:'Bedroom 1', k:'dresser',  x0:3.6,   y0:24.71, x1:7.1,   y1:26.21, f:'+Y' },
  /* Bedroom 2: bed on the right wall, wardrobe between the two doors on the left wall */
  { r:'Bedroom 2', k:'bed',      x0:16.92, y0:28.3,  x1:23.42, y1:33.3,  f:'-X' },
  { r:'Bedroom 2', k:'side',     x0:21.9,  y0:27.1,  x1:23.42, y1:28.3 },
  { r:'Bedroom 2', k:'side',     x0:21.9,  y0:33.3,  x1:23.42, y1:34.5 },
  { r:'Bedroom 2', k:'wardrobe', x0:12.21, y0:28.0,  x1:14.21, y1:33.0,  f:'+X' },
  { r:'Bedroom 2', k:'dresser',  x0:16.2,  y0:24.71, x1:19.7,  y1:26.21, f:'+Y' },
  /* Lounge: sofas and TV on the right, a four-seat dining table near the kitchen */
  { r:'Lounge', k:'sofa',   x0:20.92, y0:16.5,  x1:23.42, y1:23.0,  f:'-X' },
  { r:'Lounge', k:'sofa',   x0:16.2,  y0:21.79, x1:20.7,  y1:24.29, f:'-Y' },
  { r:'Lounge', k:'table',  x0:17.4,  y0:18.3,  x1:19.9,  y1:20.3 },
  { r:'Lounge', k:'tv',     x0:17.5,  y0:14.29, x1:21.5,  y1:15.4,  f:'+Y' },
  { r:'Lounge', k:'dining', x0:10.2,  y0:18.4,  x1:14.2,  y1:21.0 },
  /* Drawing room: three-seat sofa on the right wall, two-seat under the window, one chair */
  { r:'Drawing room', k:'sofa',  x0:20.92, y0:4.5,          x1:23.42, y1:11.0,         f:'-X' },
  { r:'Drawing room', k:'sofa',  x0:16.5,  y0:front + 0.58, x1:20.5,  y1:front + 3.08, f:'+Y' },
  { r:'Drawing room', k:'chair', x0:13.4,  y0:7.0,          x1:15.9,  y1:9.5,          f:'+X' },
  { r:'Drawing room', k:'table', x0:17.0,  y0:6.3,          x1:19.5,  y1:8.8 },
  /* Kitchen: counters on three sides, sink under the window, fridge in the rear corner */
  { r:'Kitchen', k:'counter', x0:0.58, y0:14.29, x1:2.58, y1:24.29 },
  { r:'Kitchen', k:'counter', x0:2.58, y0:14.29, x1:7.79, y1:16.29, nl:1 },
  { r:'Kitchen', k:'counter', x0:2.58, y0:22.29, x1:5.4,  y1:24.29, nl:1 },
  { r:'Kitchen', k:'sink',    x0:5.2,  y0:14.45, x1:7.2,  y1:16.1,  f:'+Y' },
  { r:'Kitchen', k:'hob',     x0:0.75, y0:18.2,  x1:2.4,  y1:20.4,  f:'+X' },
  { r:'Kitchen', k:'fridge',  x0:5.4,  y0:21.9,  x1:7.79, y1:24.29, f:'-Y' }
];

const PLAN = {
  plot: { w: 24, d: 42, lane: 8 },
  /* finished wall thickness in inches, plaster included: 6 in and 4 in blocks */
  walls: { outer: 7, inner: 5 },
  /* heights in feet for the drawn front elevation */
  elev: { plinth: 1.5, storey: 10, slab: 0.5, parapet: 3.5, stairRoom: 9, tank: 4.75,
          gate: 7, railing: 3.5, groundSill: 2.5, groundHead: 8, firstSill: 1.5, firstHead: 8.5 },
  floors: [
    { name: 'Ground floor', front: 0,
      rooms: [
        ...STAIR(0),
        /* the cross flight passes overhead, so the porch runs right back to the
           kitchen and lounge wall and a car's bonnet can go under the stair */
        { n:'Car porch',  t:'porch', x0:4, y0:0,    x1:13,   y1:14 },
        ...BACK(0, 'Open court'),
        { n:'Stair over', t:'stair', x0:4, y0:10.5, x1:8.25, y1:14,  under:true, where:'the stair passes overhead' },
        { n:'WC',         t:'wet',   x0:0, y0:9.5,  x1:4,    y1:14,  under:true }
      ],
      openings: [
        { k:'gate', ax:'h', at:0,    from:0.6,   to:3.6,   label:'Small gate', j:['the lane', 'Lobby'] },
        { k:'gate', ax:'h', at:0,    from:4.5,   to:12.5,  label:'Main gate',  j:['the lane', 'Car porch'] },
        { k:'door', ax:'v', at:4,    from:7,     to:9.5,   s:1, j:['Car porch', 'the space under the stair'], label:'Low hatch to the water motor' },
        { k:'door', ax:'v', at:4,    from:11,    to:13.25, s:1, j:['WC', 'Car porch'], label:'Door, opens outward' },
        ...INNER(0, 'Car porch', 'Car porch', 'Open court', 'Car porch'),
        { k:'door', ax:'v', at:17,   from:36.25, to:38.45, s:1,  j:['Open court', 'Bath B'] },
        { k:'door', ax:'h', at:36, from:14,    to:16.5,  s:-1, j:['Bedroom 2', 'Open court'] },
        { k:'win',  ax:'h', at:36, from:12.4,  to:13.7,        j:['Bedroom 2', 'Open court'] },
        { k:'win',  ax:'v', at:17,   from:39.9,  to:41.1,        j:['Bath B', 'Open court'], label:'Ventilator' }
      ],
      fixtures: [
        ...BATH_A, ...BATH_B, ...FURNITURE(0),
        { r:'WC', k:'commode', x0:1.4, y0:9.71, x1:2.9, y1:11.98, f:'+Y' },
        { r:'WC', k:'basin',   x0:0.6, y0:12.9, x1:1.6, y1:13.79, f:'-Y' },
        /* 3,000 imperial gallons is about 482 cu ft: 7 ft x 11 ft 3 in with 6 ft 1 in of water.
           The tank is already as wide as the porch allows, so it is made longer instead. */
        { r:'Car porch',  k:'tank',  x0:5.05, y0:1.5,  x1:12.05, y1:12.75, mh:{ x0:5.05, y0:3.8, x1:7.05, y1:5.8 },
          label:'Underground water tank', sub:"3,000 gal · 7' × 11'3\" · 6'10\" deep" },
        { r:'Car porch',  k:'basin', x0:4.29, y0:9.6,  x1:5.4,  y1:10.85, f:'+X' },
        { r:'Open court', k:'wash',  x0:7.3,  y0:36.3, x1:10.5, y1:41.4, label:'Washing area' },
        { r:'Open court', k:'basin', x0:13.2, y0:40.4, x1:14.7, y1:41.42, f:'-Y' }
      ] },

    { name: 'First floor', front: -1,
      rooms: [
        ...STAIR(-1),
        { n:'Cross stair', t:'stair',   x0:4,    y0:10.5, x1:8.25, y1:14, treads:5, dir:'+X' },
        { n:'Balcony',     t:'balcony', x0:4,    y0:-1,   x1:13,   y1:10.5 },
        { n:'Entry',       t:'balcony', x0:8.25, y0:10.5, x1:13,   y1:14 },
        ...BACK(-1, 'Air duct')
      ],
      openings: [
        { k:'rail', ax:'h', at:-1,   from:4,    to:13,   j:['Balcony', 'the lane'] },
        { k:'open', ax:'v', at:8.25, from:10.5, to:14,   j:['Cross stair', 'Entry'], label:'Stair arrives' },
        { k:'open', ax:'h', at:10.5, from:8.25, to:13,   j:['Balcony', 'Entry'] },
        ...INNER(-1, 'Balcony', 'Entry', 'Air duct', 'Cross stair'),
        { k:'door', ax:'h', at:36, from:17.5, to:19.75, s:1, j:['Bedroom 2', 'Bath B'] },
        { k:'win',  ax:'h', at:36, from:13,   to:16,         j:['Bedroom 2', 'Air duct'] },
        { k:'win',  ax:'v', at:17,   from:39.6, to:41,         j:['Bath B', 'Air duct'], label:'Ventilator' }
      ],
      fixtures: [ ...BATH_A, ...BATH_B, ...FURNITURE(-1) ] },

    /* The roof: an open terrace, the stair room standing on it, and the
       overhead tank sitting on top of the stair room.  "quiet" pieces are
       parts of the terrace that only exist to fill the outline. */
    { name: 'Roof', front: -1, roof: true, levelText: "Roof level, 20' above the ground floor",
      rooms: [
        /* the stair tower: X 0..8.25, Y 6.5..14.  The lower half of the side flight
           is still under the roof slab, so the tower starts where headroom runs out. */
        { n:'Side stair',   t:'stair',   x0:0,    y0:6.5,  x1:4,    y1:10.5, treads:5, dir:'-Y', lab:'DN' },
        { n:'Landing',      t:'stair',   x0:0,    y0:10.5, x1:4,    y1:14 },
        { n:'Cross stair',  t:'stair',   x0:4,    y0:10.5, x1:8.25, y1:14,   treads:5, dir:'-X', lab:'DN' },
        { n:'Cupboards',    t:'stair',   x0:4,    y0:6.5,  x1:8.25, y1:10.5 },
        /* the open roof round it */
        { n:'Roof terrace', t:'terrace', x0:0,    y0:14,   x1:24,   y1:36 },
        { n:'t1', t:'terrace', quiet:'Roof terrace', x0:8.25, y0:-1,   x1:24,   y1:14 },
        { n:'t2', t:'terrace', quiet:'Roof terrace', x0:0,    y0:-1,   x1:8.25, y1:6.5 },
        { n:'t3', t:'terrace', quiet:'Roof terrace', x0:0,    y0:36, x1:7,    y1:42 },
        { n:'t4', t:'terrace', quiet:'Roof terrace', x0:17,   y0:36, x1:24,   y1:42 },
        { n:'Air duct',     t:'open',    x0:7,    y0:36, x1:17,   y1:42 },
        /* the tank covers the whole tower, so its walls are the tower walls carried up;
           "clear" is the inside size */
        { n:'Water tank (above)', t:'wet', x0:0,  y0:6.5,  x1:8.25, y1:14, under:true,
          where:'on top of the stair tower', clear:{ w:7.25, h:6.5 } }
      ],
      openings: [
        { k:'door', ax:'v', at:8.25, from:11, to:13.5, s:1, j:['Cross stair', 'Roof terrace'], label:'Door to the roof' }
      ],
      fixtures: [] }
  ],

  /* what is said about each room on its details sheet.  A key ending in
     "@0" or "@1" applies to that floor only. */
  details: {
    'Drawing room':   { notes: ['Guest room at the front, entered from the porch and from the lounge.',
                                'Seats six: a three-seat sofa on the right wall, a two-seat sofa under the window and one armchair.'] },
    'Drawing room@0': { notes: ['Front window 7 ft wide, onto the lane.'] },
    'Drawing room@1': { notes: ['Projects 1 ft over the lane, so it is a foot deeper than the one below.',
                                'This is the grey box with the tall window on the elevation.'] },
    'Kitchen':        { notes: ['Counters on three sides with the sink under the window, the hob on the long left counter and the fridge in the rear corner. The clear floor between them is about 5 ft 2 in by 6 ft.',
                                'Runs the full depth from the porch wall to the bedroom wall, with no wardrobe recess behind it.',
                                'Open to the lounge through a counter opening 5 ft 6 in wide.',
                                'The window gives air and borrowed light from the covered space under the stair, not direct daylight.',
                                'Allow for an exhaust fan or duct.'] },
    'Lounge':         { notes: ['Sofas and the TV are on the right. A four-seat dining table is near the kitchen, leaving about 2 ft to pass behind it to the bedroom doors.',

/* ==========================================================================
   HELPERS
   ========================================================================== */
let view = 'both';            // 'both' | 0 | 1 | 'room' | 'elev'
let selF = 0, selR = PLAN.floors[0].rooms.findIndex(r => r.n === 'Drawing room');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function ft(v) {                                   // feet -> 9'6"
  const total = Math.round(Math.abs(v) * 12), f = Math.floor(total / 12), i = total % 12;
  return f + "'" + (i ? i + '"' : '');
}
const area = r => Math.abs((r.x1 - r.x0) * (r.y1 - r.y0));
function box(r) { return { x0: Math.min(r.x0, r.x1), x1: Math.max(r.x0, r.x1),
                           y0: Math.min(r.y0, r.y1), y1: Math.max(r.y0, r.y1) }; }

/* ==========================================================================
   WALLS
     - a wall on the plot boundary is an outer wall and sits fully inside the plot
     - a wall facing the porch, balcony or court is an outer wall, centred on its line
     - every other wall is an inside wall, centred on its line
     - no wall between two pieces of the stair, or two pieces of porch / balcony
   ========================================================================== */
const OPEN_AIR = { porch:1, balcony:1, open:1, terrace:1 };
function wallBetween(a, b) {                       // thickness in feet, 0 = no wall
  if (a.t === b.t && (a.t === 'stair' || a.t === 'porch' || a.t === 'balcony' || a.t === 'terrace')) return 0;
  return ((OPEN_AIR[a.t] || OPEN_AIR[b.t]) ? PLAN.walls.outer : PLAN.walls.inner) / 12;
}
function sidesOf(F, r) {
  const W = PLAN.plot.w, D = PLAN.plot.d, e = 0.01, b = box(r);
  const others = F.rooms.filter(q => !q.under && q !== r).map(q => ({ q, b: box(q) }));
  const defs = [
    { ax:'h', at:b.y0, from:b.x0, to:b.x1, edge:b.y0 <= F.front + e, hit:o => Math.abs(o.b.y1 - b.y0) < e, lo:o => o.b.x0, hi:o => o.b.x1 },
    { ax:'h', at:b.y1, from:b.x0, to:b.x1, edge:b.y1 >= D - e,       hit:o => Math.abs(o.b.y0 - b.y1) < e, lo:o => o.b.x0, hi:o => o.b.x1 },
    { ax:'v', at:b.x0, from:b.y0, to:b.y1, edge:b.x0 <= e,           hit:o => Math.abs(o.b.x1 - b.x0) < e, lo:o => o.b.y0, hi:o => o.b.y1 },
    { ax:'v', at:b.x1, from:b.y0, to:b.y1, edge:b.x1 >= W - e,       hit:o => Math.abs(o.b.x0 - b.x1) < e, lo:o => o.b.y0, hi:o => o.b.y1 }
  ];
  return defs.map(d => {
    const segs = [];
    for (const o of others) {
      if (!d.hit(o)) continue;
      const from = Math.max(d.from, d.lo(o)), to = Math.min(d.to, d.hi(o));
      const t = wallBetween(r, o.q);
      if (to - from > e && t > 0) segs.push({ from, to, t });
    }
    let open = 0;      // a side that is mostly an open archway takes nothing from the room
    for (const p of (F.openings || []))
      if (p.k === 'open' && p.ax === d.ax && Math.abs(p.at - d.at) < e)
        open += Math.max(0, Math.min(d.to, Math.max(p.from, p.to)) - Math.max(d.from, Math.min(p.from, p.to)));
    let take = 0;
    if (d.edge) take = PLAN.walls.outer / 12;
    else if (open >= 0.7 * (d.to - d.from)) take = 0;
    else if (segs.length) take = Math.max(...segs.map(s => s.t)) / 2;
    else if (r.under) take = PLAN.walls.inner / 24;
    return { ax:d.ax, at:d.at, from:d.from, to:d.to, edge:d.edge, segs, take };
  });
}
function clearOf(F, r) {                           // size inside the walls
  if (r.clear) return r.clear;
  const b = box(r), s = sidesOf(F, r);
  return { w: Math.max(0, (b.x1 - b.x0) - s[2].take - s[3].take),
           h: Math.max(0, (b.y1 - b.y0) - s[0].take - s[1].take) };
}

/* ==========================================================================
   DRAWING  (plain SVG, presentation attributes only so PNG export works)
   opt.detail = room index: draw a close-up of that room, cropped to opt.crop
   ========================================================================== */
const S = 15, MT = 34, MB = 74;
/* On a phone the side dimension lines are dropped so the plan can fill the
   screen, and the labels are drawn larger. */
let ML = 50, MR = 84, compact = false;
function setCompact(c) { compact = c; ML = c ? 12 : 50; MR = c ? 12 : 84; }
const FILL = { room:'#fdfbf6', wet:'#e2eef2', stair:'#f3f3f0', porch:'#efebe2',
               balcony:'#f5efdf', terrace:'#eeeee6', open:'url(#hatch)' };
const INK = '#22262c', DIM = '#9a5b23', PAPER = '#ffffff', FONT = 'Segoe UI, Roboto, Arial, sans-serif';
const PX = x => ML + x * S, PY = y => MT + (PLAN.plot.d - y) * S;

/* Furniture symbols.  Drawn in a local frame w wide and d deep, with the back
   of the piece at the top; the caller rotates it to face the right way.
   Returns the label to show in a close-up. */
function furniture(x, w, d, g) {
  const LN = '#7d7466', BODY = '#f6f1e8', SOFT = '#e9e0d0', WOOD = '#e2d5bf';
  const R = (x0, y0, ww, hh, fill, rx, sw) =>
    `<rect x="${x0}" y="${y0}" width="${ww}" height="${hh}" rx="${rx || 0}" fill="${fill}" stroke="${LN}" stroke-width="${sw || .9}"/>`;
  const L = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${LN}" stroke-width=".7"/>`;
  switch (x.k) {
    case 'bed':
      g.push(R(-w / 2, -d / 2, w, d, BODY, 2));
      g.push(R(-w / 2 + 2, -d / 2 + d * .3, w - 4, d * .7 - 2, SOFT, 2, .6));           // blanket
      for (const sx of [-1, 1]) g.push(R(sx * w * .24 - w * .19, -d / 2 + d * .06, w * .38, d * .17, '#ffffff', 3, .7));
      return 'Bed';
    case 'side':
      g.push(R(-w / 2, -d / 2, w, d, WOOD, 1.5, .7));
      return '';
    case 'wardrobe': {
      g.push(R(-w / 2, -d / 2, w, d, WOOD, 1));
      g.push(L(-w / 2, d / 2 - d * .14, w / 2, d / 2 - d * .14));
      const n = Math.max(2, Math.round(w / S / 1.5));
      for (let k = 1; k < n; k++) g.push(L(-w / 2 + w * k / n, -d / 2, -w / 2 + w * k / n, d / 2));
      return 'Wardrobe'; }
    case 'dresser':
      g.push(R(-w / 2, -d / 2, w, d, WOOD, 1.5));
      g.push(`<line x1="${-w * .3}" y1="${-d / 2 + 1.6}" x2="${w * .3}" y2="${-d / 2 + 1.6}" stroke="${LN}" stroke-width="2"/>`);   // mirror
      g.push(`<circle cx="0" cy="${d / 2 + S * .85}" r="${S * .5}" fill="${SOFT}" stroke="${LN}" stroke-width=".7"/>`);                 // stool
      return 'Dressing table';
    case 'sofa': case 'chair': {
      const arm = S * .38, back = d * .28;
      g.push(R(-w / 2, -d / 2, w, d, SOFT, 3));
      g.push(R(-w / 2, -d / 2, w, back, BODY, 3, .7));
      g.push(R(-w / 2, -d / 2, arm, d, BODY, 3, .7) + R(w / 2 - arm, -d / 2, arm, d, BODY, 3, .7));
      const n = x.k === 'chair' ? 1 : Math.max(1, Math.round((w - 2 * arm) / (S * 2.1)));
      for (let k = 1; k < n; k++) { const px = -w / 2 + arm + (w - 2 * arm) * k / n; g.push(L(px, -d / 2 + back, px, d / 2)); }
      return x.k === 'chair' ? 'Chair' : 'Sofa'; }
    case 'table':
      g.push(R(-w / 2, -d / 2, w, d, WOOD, 3));
      return 'Table';
    case 'dining': {
      const n = Math.max(1, Math.round(w / (S * 2))), cw = S * 1.25, ch = S * 1.15;
      for (let k = 0; k < n; k++) { const px = -w / 2 + w * (k + .5) / n - cw / 2;
        g.push(R(px, -d / 2 - ch - 1, cw, ch, SOFT, 2.5, .7) + R(px, d / 2 + 1, cw, ch, SOFT, 2.5, .7)); }
      g.push(R(-w / 2, -d / 2, w, d, WOOD, 3));
      return 'Dining table'; }
    case 'tv':
      g.push(R(-w / 2, -d / 2, w, d, WOOD, 1.5));
      g.push(`<rect x="${-w * .36}" y="${-d / 2 + 1}" width="${w * .72}" height="2.4" fill="#3a3d42"/>`);
      return 'TV';
    case 'counter':
      g.push(R(-w / 2, -d / 2, w, d, '#dcd5c8', 0, .8));
      return x.nl ? '' : 'Counter';
    case 'sink':
      g.push(R(-w / 2, -d / 2, w, d, '#f4f6f7', 2));
      g.push(R(-w * .36, -d * .26, w * .72, d * .62, '#ffffff', 4, .7));
      g.push(`<circle cx="0" cy="${-d * .38}" r="1.1" fill="${LN}"/>`);
      return 'Sink';
    case 'hob':
      g.push(R(-w / 2, -d / 2, w, d, '#44474d', 2));
      for (const sx of [-1, 1]) for (const sy of [-1, 1])
        g.push(`<circle cx="${sx * w * .23}" cy="${sy * d * .23}" r="${Math.min(w, d) * .14}" fill="none" stroke="#d9dbde" stroke-width=".8"/>`);
      return 'Hob';
    case 'fridge':
      g.push(R(-w / 2, -d / 2, w, d, '#f4f6f7', 2));
      g.push(L(-w / 2, d / 2 - d * .12, w / 2, d / 2 - d * .12));
      return 'Fridge';
  }
  return '';
}

function drawFloor(fi, opt) {
  opt = opt || {};
  const F = PLAN.floors[fi], W = PLAN.plot.w, D = PLAN.plot.d;
  const close = opt.detail !== undefined, fs = opt.fs || (compact ? 1.2 : 1);
  const lowest = Math.min(0, ...PLAN.floors.map(f => f.front));   // keep floors aligned
  const X = PX, Y = PY;
  const width = ML + W * S + MR, height = MT + (D - lowest) * S + MB;
  const o = [];
  const line = (x1, y1, x2, y2, st, w, extra) =>
    `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${st}" stroke-width="${w}" ${extra || ''}/>`;
  const text = (x, y, s, size, fill, extra) =>
    `<text x="${x}" y="${y}" font-size="${(size * fs).toFixed(2)}" fill="${fill}" text-anchor="middle" ` +
    `font-family="${FONT}" ${extra || ''}>${esc(s)}</text>`;
  const halo = `stroke="#ffffff" stroke-opacity=".8" stroke-width="${(3 * fs).toFixed(2)}" paint-order="stroke"`;

  const vb = opt.crop ? `${opt.crop.x} ${opt.crop.y} ${opt.crop.w} ${opt.crop.h}` : `0 0 ${width} ${height}`;
  const vw = opt.crop ? opt.crop.w : width, vh = opt.crop ? opt.crop.h : height;
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${vw}" height="${vh}" data-floor="${fi}">`);
  o.push(`<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">` +
         `<rect width="7" height="7" fill="#eef3ea"/><line x1="0" y1="0" x2="0" y2="7" stroke="#cfdcc8" stroke-width="2"/></pattern>` +
         `<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">` +
         `<path d="M0 0 L10 5 L0 10 z" fill="#7a808a"/></marker></defs>`);
  o.push(`<rect x="-200" y="-200" width="${width + 400}" height="${height + 400}" fill="${PAPER}"/>`);
  if (!close) {
    o.push(`<text x="${ML}" y="20" font-size="14" font-weight="700" fill="${INK}" font-family="${FONT}">${esc(F.name.toUpperCase())}${compact ? ' &#183; ' + esc(ft(W) + ' × ' + ft(D - F.front)) : ''}</text>`);
    if (!compact) o.push(`<text x="${width - 8}" y="20" font-size="8.5" fill="#8b9099" text-anchor="end" font-family="${FONT}">sizes in rooms are clear inside the walls</text>`);
  }
  if (F.front < 0) {            // the plot line the upper floor projects past
    o.push(line(-1.2, 0, W + 2.2, 0, '#c0392b', 1, 'stroke-dasharray="5 4"'));
    if (!close && !compact) o.push(`<text x="${X(W) + 36}" y="${Y(0) + 3}" font-size="8.5" fill="#c0392b" font-family="${FONT}">plot line</text>`);
  }

  const rooms = F.rooms.map((r, i) => ({ r, i,
    x: Math.min(r.x0, r.x1), y: Math.min(r.y0, r.y1),
    w: Math.abs(r.x1 - r.x0), h: Math.abs(r.y1 - r.y0) }));
  const solid = rooms.filter(q => !q.r.under), under = rooms.filter(q => q.r.under);
  const rect = (q, attrs) =>
    `<rect x="${X(q.x)}" y="${Y(q.y + q.h)}" width="${q.w * S}" height="${q.h * S}" ${attrs}/>`;

  /* 1. room fills */
  const idOf = q => q.r.quiet ? F.rooms.findIndex(r => r.n === q.r.quiet) : q.i;
  for (const q of solid)
    o.push(rect(q, `fill="${FILL[q.r.t] || FILL.room}" data-f="${fi}" data-i="${idOf(q)}" style="cursor:pointer"`));

  /* 2. stair treads and direction arrows */
  for (const q of solid) {
    if (q.r.t !== 'stair') continue;
    o.push(rect(q, `fill="none" stroke="#b9bcc0" stroke-width="1" pointer-events="none"`));
    const n = q.r.treads | 0;
    if (!n) continue;
    const alongY = (q.r.dir || '+Y').charAt(1) === 'Y', neg = (q.r.dir || '+Y').charAt(0) === '-';
    for (let k = 0; k < n; k++) {
      if (alongY) o.push(line(q.x, q.y + q.h * k / n, q.x + q.w, q.y + q.h * k / n, '#b9bcc0', 1));
      else        o.push(line(q.x + q.w * k / n, q.y, q.x + q.w * k / n, q.y + q.h, '#b9bcc0', 1));
    }
    if (alongY) {
      const a = neg ? q.y + q.h - 0.5 : q.y + 0.5, b = neg ? q.y + 0.5 : q.y + q.h - 0.5;
      o.push(line(q.x + q.w / 2, a, q.x + q.w / 2, b, '#7a808a', 1.3, 'marker-end="url(#arr)"'));
    } else {
      const a = neg ? q.x + q.w - 0.5 : q.x + 0.5, b = neg ? q.x + 0.5 : q.x + q.w - 0.5;
      o.push(line(a, q.y + q.h / 2, b, q.y + q.h / 2, '#7a808a', 1.3, 'marker-end="url(#arr)"'));
    }
  }

  /* 3. walls at their real thickness, then the boundary wall inside the plot */
  for (const q of solid) {
    if (q.r.t === 'stair') continue;
    for (const sd of sidesOf(F, q.r)) for (const g of sd.segs) {
      const lo = sd.ax === 'h' ? 0 : F.front, hi = sd.ax === 'h' ? W : D;
      const f0 = Math.max(lo, g.from - g.t / 2), f1 = Math.min(hi, g.to + g.t / 2);
      const a = sd.ax === 'h' ? [f0, sd.at] : [sd.at, f0], b = sd.ax === 'h' ? [f1, sd.at] : [sd.at, f1];
      o.push(line(a[0], a[1], b[0], b[1], INK, (g.t * S).toFixed(2), 'pointer-events="none"'));
    }
  }
  const bw = PLAN.walls.outer / 12 * S;
  o.push(`<rect x="${X(0) + bw / 2}" y="${Y(D) + bw / 2}" width="${W * S - bw}" height="${(D - F.front) * S - bw}" ` +
         `fill="none" stroke="${INK}" stroke-width="${bw}" pointer-events="none"/>`);

  /* 4. doors, windows, gates */
  for (const p of (F.openings || [])) {
    const h = p.ax === 'h', len = Math.abs(p.to - p.from);
    const A = h ? [p.from, p.at] : [p.at, p.from], B = h ? [p.to, p.at] : [p.at, p.to];
    const outer = (h && (p.at === F.front || p.at === D)) || (!h && (p.at === 0 || p.at === W));
    let dx = 0, dy = 0;        // openings on the boundary sit on the inset wall line
    if (outer) { if (h) dy = p.at === D ? bw / 2 : -bw / 2; else dx = p.at === 0 ? bw / 2 : -bw / 2; }
    const L = (st, w, extra) => `<line x1="${X(A[0]) + dx}" y1="${Y(A[1]) + dy}" x2="${X(B[0]) + dx}" y2="${Y(B[1]) + dy}" ` +
                                `stroke="${st}" stroke-width="${w}" ${extra || ''}/>`;
    o.push(L(PAPER, bw + 2.5));                                   // cut the wall
    if (p.k === 'win')  { o.push(L('#2f7fc1', 5)); o.push(L('#d9ecfa', 2)); }
    if (p.k === 'gate') { o.push(L('#3a3f47', 4, 'stroke-dasharray="7 2"'));
      if (p.label && !close) o.push(text((X(A[0]) + X(B[0])) / 2, Y(p.at) + 17, p.label, 9, INK)); }
    if (p.k === 'rail') { o.push(L('#7a808a', 2, 'stroke-dasharray="2 3"')); }
    if (p.k === 'door') {
      const s = p.s < 0 ? -1 : 1;
      const H = A, T = h ? [p.from, p.at + s * len] : [p.at + s * len, p.from], E = B;
      const hx = X(H[0]) + dx, hy = Y(H[1]) + dy, tx = X(T[0]) + dx, ty = Y(T[1]) + dy,
            ex = X(E[0]) + dx, ey = Y(E[1]) + dy, r = len * S;
      const sweep = ((tx - hx) * (ey - hy) - (ty - hy) * (ex - hx)) > 0 ? 1 : 0;
      o.push(`<line x1="${hx}" y1="${hy}" x2="${tx}" y2="${ty}" stroke="${INK}" stroke-width="1.6"/>`);
      o.push(`<path d="M${tx} ${ty} A${r} ${r} 0 0 ${sweep} ${ex} ${ey}" fill="none" stroke="#8b9099" stroke-width="1" stroke-dasharray="3 2"/>`);
    }
  }

  /* 5. spaces under the stair, dashed */
  for (const q of under)
    o.push(rect(q, `fill="${q.r.t === 'wet' ? '#cfe3ea' : '#e9e4d6'}" fill-opacity=".75" stroke="#5b6470" ` +
                   `stroke-width="1.2" stroke-dasharray="4 3" data-f="${fi}" data-i="${q.i}" style="cursor:pointer"`));

  /* 6. toilets, basins, showers */
  const FX = '#4f5863';
  for (const x of (F.fixtures || [])) {
    const b = box(x), cx = (X(b.x0) + X(b.x1)) / 2, cy = (Y(b.y0) + Y(b.y1)) / 2;
    const pw = (b.x1 - b.x0) * S, ph = (b.y1 - b.y0) * S;
    let name = '';
    if (x.k === 'tank') {                         // below the floor: dashed outline, manhole in the front corner
      o.push(`<rect x="${X(b.x0)}" y="${Y(b.y1)}" width="${pw}" height="${ph}" fill="#bcd9ee" fill-opacity=".35" stroke="#2f7fc1" stroke-width="1.2" stroke-dasharray="6 3" pointer-events="none"/>`);
      /* manhole: where the data puts it, otherwise the front right corner */
      const m = x.mh ? box(x.mh) : { x0: b.x1 - 2.3, x1: b.x1 - 0.3, y0: b.y0 + 0.3, y1: b.y0 + 2.3 };
      const mxp = X(m.x0), myp = Y(m.y1), mw = (m.x1 - m.x0) * S, mhh = (m.y1 - m.y0) * S;
      o.push(`<rect x="${mxp}" y="${myp}" width="${mw}" height="${mhh}" fill="#ffffff" fill-opacity=".7" stroke="#1f5f96" stroke-width="1.3" pointer-events="none"/>`);
      o.push(`<line x1="${mxp}" y1="${myp}" x2="${mxp + mw}" y2="${myp + mhh}" stroke="#2f7fc1" stroke-width=".7" pointer-events="none"/>`);
      o.push(`<line x1="${mxp + mw}" y1="${myp}" x2="${mxp}" y2="${myp + mhh}" stroke="#2f7fc1" stroke-width=".7" pointer-events="none"/>`);
      o.push(text(mxp + mw / 2, myp + mhh + 8 * fs, 'Manhole', 6.5, '#1f5f96', `font-weight="600" pointer-events="none" ${halo}`));
      o.push(text(X(b.x0) + pw * .62, Y(b.y0) - ph * .22, x.label || 'Underground tank', 7.5, '#1f5f96', `font-weight="600" pointer-events="none" ${halo}`));
      if (x.sub) o.push(text(X(b.x0) + pw * .62, Y(b.y0) - ph * .22 + 9 * fs, x.sub, 6.5, '#1f5f96', `pointer-events="none" ${halo}`));
      continue;
    }
    if (x.k === 'wash') {                         // washing floor with room for a machine
      o.push(`<rect x="${X(b.x0)}" y="${Y(b.y1)}" width="${pw}" height="${ph}" fill="#d6e6ee" fill-opacity=".8" stroke="${FX}" stroke-width=".8" stroke-dasharray="3 2" pointer-events="none"/>`);
      const wm = 2 * S, wx = X(b.x0) + 4, wy = Y(b.y1) + 4;
      o.push(`<rect x="${wx}" y="${wy}" width="${wm}" height="${wm}" rx="2" fill="#fff" stroke="${FX}" stroke-width=".9" pointer-events="none"/>`);
      o.push(`<circle cx="${wx + wm / 2}" cy="${wy + wm / 2}" r="${wm * .3}" fill="none" stroke="${FX}" stroke-width=".8" pointer-events="none"/>`);
      o.push(text(cx, Y(b.y0) - 9 * fs, x.label || 'Washing area', 7, FX, `pointer-events="none" ${halo}`));
      continue;
    }
    if (x.k === 'platform') {
      o.push(`<rect x="${X(b.x0)}" y="${Y(b.y1)}" width="${pw}" height="${ph}" fill="#c9dde5" stroke="${FX}" stroke-width=".8" stroke-dasharray="3 2" pointer-events="none"/>`);
      if (close) o.push(text(cx, Y(b.y0) + 8 * fs, 'platform above this line, raised 1 ft', 6.5, FX, `pointer-events="none" ${halo}`));
      continue;
    }
    if (x.k === 'shower') {
      o.push(`<rect x="${X(b.x0) + 2}" y="${Y(b.y1) + 2}" width="${pw - 4}" height="${ph - 4}" fill="none" stroke="${FX}" stroke-width=".8" stroke-dasharray="2 2" pointer-events="none"/>`);
      o.push(`<circle cx="${cx}" cy="${cy}" r="${Math.min(pw, ph) * .16}" fill="none" stroke="${FX}" stroke-width=".9" pointer-events="none"/>`);
      o.push(`<circle cx="${cx}" cy="${cy}" r="1.2" fill="${FX}" pointer-events="none"/>`);
      if (close) o.push(text(cx, cy + Math.min(pw, ph) * .16 + 8 * fs, 'Shower', 7, FX, `pointer-events="none" ${halo}`));
      continue;
    }
    const ang = { '-Y':0, '+Y':180, '+X':-90, '-X':90 }[x.f || '-Y'];
    const w = ang % 180 === 0 ? pw : ph, d = ang % 180 === 0 ? ph : pw;     // across the wall, out from it
    const g = [];
    if (x.k === 'commode') {
      g.push(`<rect x="${-w / 2}" y="${-d / 2}" width="${w}" height="${d * .27}" rx="1.5" fill="#fff" stroke="${FX}" stroke-width=".9"/>`);
      g.push(`<ellipse cx="0" cy="${-d / 2 + d * .27 + d * .36}" rx="${w * .37}" ry="${d * .36}" fill="#fff" stroke="${FX}" stroke-width=".9"/>`);
      g.push(`<ellipse cx="0" cy="${-d / 2 + d * .27 + d * .38}" rx="${w * .22}" ry="${d * .24}" fill="none" stroke="${FX}" stroke-width=".6"/>`);
      name = 'Commode';
    } else if (x.k === 'asian') {
      g.push(`<rect x="${-w / 2}" y="${-d / 2}" width="${w}" height="${d}" rx="3" fill="#fff" stroke="${FX}" stroke-width=".9"/>`);
      g.push(`<ellipse cx="0" cy="${-d * .04}" rx="${w * .17}" ry="${d * .3}" fill="none" stroke="${FX}" stroke-width=".9"/>`);
      for (const sx of [-1, 1])
        g.push(`<rect x="${sx * w * .33 - w * .08}" y="${-d * .22}" width="${w * .16}" height="${d * .46}" rx="1.5" fill="none" stroke="${FX}" stroke-width=".7"/>`);
      name = 'Asian toilet';
    } else if (x.k === 'basin') {
      g.push(`<rect x="${-w / 2}" y="${-d / 2}" width="${w}" height="${d}" rx="2" fill="#fff" stroke="${FX}" stroke-width=".9"/>`);
      g.push(`<ellipse cx="0" cy="${d * .06}" rx="${w * .33}" ry="${d * .3}" fill="none" stroke="${FX}" stroke-width=".7"/>`);
      g.push(`<circle cx="0" cy="${-d * .34}" r="1" fill="${FX}"/>`);
      name = 'Basin';
    } else {
      name = furniture(x, w, d, g);
    }
    o.push(`<g transform="translate(${cx} ${cy}) rotate(${ang})" pointer-events="none">${g.join('')}</g>`);
    if (close && name) o.push(text(cx, cy + 2.5 * fs, name, x.k === 'basin' ? 6 : 7, FX, `pointer-events="none" ${halo}`));
  }

  /* 7. labels */
  for (const q of rooms) {
    if (q.r.quiet) continue;
    if (close && q.i === opt.detail) continue;            // the sheet already names it
    const cx = X(q.x + q.w / 2), cy = Y(q.y + q.h / 2);
    const small = q.w < 5.2 || q.h < 3.2, tiny = q.w < 3.8 && q.h < 3.8;
    const stairRun = q.r.t === 'stair' && (q.r.treads | 0) > 0;
    const mx = q.x + q.w / 2, my = q.y + q.h / 2;         // a stair label gives way to what is under it
    if (q.r.t === 'stair' && under.some(u => u !== q && mx > u.x && mx < u.x + u.w && my > u.y && my < u.y + u.h)) continue;
    if (stairRun) { o.push(text(cx, cy + 3, q.r.lab || 'UP', 8.5, '#5b6470', 'font-weight="700" pointer-events="none" ' +
                                `stroke="${FILL.stair}" stroke-width="3" paint-order="stroke"`)); continue; }
    const anyFx = (F.fixtures || []).some(x => x.r === q.r.n);
    const hasFx = anyFx && q.r.t === 'wet';                    // baths: smaller label, moved clear of the toilets
    const fz = tiny ? 7.5 : (small || hasFx) ? 8.5 : 11.5;
    const vertical = q.w < 4.2 && q.h > q.w * 1.6;
    const rot = vertical ? `transform="rotate(-90 ${cx} ${cy})"` : '';
    const style = `pointer-events="none" ${rot} ${anyFx ? halo : ''} ` + (q.r.under ? 'font-style="italic"' : 'font-weight="600"');
    const showSize = !tiny && q.r.t !== 'stair' && !(compact && !close && (small || hasFx));
    const lift = hasFx && !q.r.under ? q.h * S * 0.2 : 0;    // keep bath names clear of the toilets
    o.push(text(cx, cy + lift + (showSize ? -1 : 3) * fs, q.r.n, fz, INK, style));
    if (showSize) {
      const c = clearOf(F, q.r);
      o.push(text(cx, cy + lift + (fz + 1) * fs, ft(c.w) + ' × ' + ft(c.h), fz - 1.5, '#667080', `pointer-events="none" ${rot} ${anyFx ? halo : ''}`));
    }
  }

  /* 8. close-up: outline the room and write its clear size along two sides */
  if (close && rooms[opt.detail]) {
    const q = rooms[opt.detail], c = clearOf(F, q.r), sd = sidesOf(F, q.r);
    o.push(rect(q, `fill="none" stroke="#d98324" stroke-width="${(2.2 * fs).toFixed(2)}" stroke-dasharray="${6 * fs} ${4 * fs}" pointer-events="none"`));
    const ix0 = X(q.x + sd[2].take), ix1 = X(q.x + q.w - sd[3].take), iy0 = Y(q.y + sd[0].take), iy1 = Y(q.y + q.h - sd[1].take);
    /* written just outside the room so they stay clear of what is drawn inside */
    o.push(text((ix0 + ix1) / 2, Y(q.y) + 15 * fs, ft(c.w) + ' clear', 9, DIM, `font-weight="600" pointer-events="none" ${halo}`));
    const tx = X(q.x + q.w) + 13 * fs, ty = (iy0 + iy1) / 2;
    o.push(text(tx, ty, ft(c.h) + ' clear', 9, DIM, `font-weight="600" pointer-events="none" transform="rotate(-90 ${tx} ${ty})" ${halo}`));
  }

  /* 9. dimension lines round the whole plan */
  if (!close) {
    const uniq = a => [...new Set(a.map(v => +v.toFixed(3)))].sort((p, q) => p - q);
    const tick = (x, y) => `<line x1="${x - 3}" y1="${y + 3}" x2="${x + 3}" y2="${y - 3}" stroke="${DIM}" stroke-width="1"/>`;
    const dimtxt = (x, y, s, rot) => `<text x="${x}" y="${y}" font-size="${compact ? 10.5 : 9}" fill="${DIM}" text-anchor="middle" ` +
      `font-family="${FONT}" ${rot ? `transform="rotate(-90 ${x} ${y})"` : ''}>${s}</text>`;
    if (!compact) {
    const ys = uniq([F.front, D, ...solid.filter(q => q.x + q.w >= W - 0.01).flatMap(q => [q.y, q.y + q.h])]);
    const rx = X(W) + 16;
    o.push(`<line x1="${rx}" y1="${Y(ys[0])}" x2="${rx}" y2="${Y(ys[ys.length - 1])}" stroke="${DIM}" stroke-width="1"/>`);
    ys.forEach((v, k) => { o.push(tick(rx, Y(v)));
      if (k) o.push(dimtxt(rx + 12, (Y(v) + Y(ys[k - 1])) / 2 + 3, esc(ft(v - ys[k - 1])), true)); });
    }
    const by = Y(F.front) + 42;
    const xs = uniq([0, W, ...solid.filter(q => q.y <= F.front + 0.01).flatMap(q => [q.x, q.x + q.w])]);
    o.push(`<line x1="${X(xs[0])}" y1="${by}" x2="${X(xs[xs.length - 1])}" y2="${by}" stroke="${DIM}" stroke-width="1"/>`);
    xs.forEach((v, k) => { o.push(tick(X(v), by));
      if (k) o.push(dimtxt((X(v) + X(xs[k - 1])) / 2, by - 4, esc(ft(v - xs[k - 1])))); });
    if (!compact) {
    const lx = X(0) - 18;
    o.push(`<line x1="${lx}" y1="${Y(D)}" x2="${lx}" y2="${Y(F.front)}" stroke="${DIM}" stroke-width="1"/>`);
    o.push(tick(lx, Y(D)) + tick(lx, Y(F.front)));
    o.push(dimtxt(lx - 6, (Y(D) + Y(F.front)) / 2, esc(ft(D - F.front)) + ' overall', true));
    }
    o.push(dimtxt((X(0) + X(W)) / 2, by + 14, esc(ft(W)) + ' overall'));
    o.push(`<text x="${(X(0) + X(W)) / 2}" y="${by + 28}" font-size="9.5" fill="#8b9099" text-anchor="middle" letter-spacing="2" ` +
           `font-family="${FONT}">STREET &#183; ${PLAN.plot.lane} FT LANE</text>`);
  }
  o.push('</svg>');
  return o.join('');
}

/* ==========================================================================
   FRONT ELEVATION, drawn to scale from the plan
   Gate, window and balcony positions are read from the floor plans, so the
   elevation follows the plan.  The parapet runs the full width at one height.
   ========================================================================== */
function elevLevels() {
  const E = PLAN.elev, zG = E.plinth, zF = zG + E.storey, zR = zF + E.storey;
  return { zG, zF, zR, zP: zR + E.parapet, zS: zR + E.stairRoom, zT: zR + E.stairRoom + E.tank };
}
function drawElevation() {
  const E = PLAN.elev, W = PLAN.plot.w, G = PLAN.floors[0], F1 = PLAN.floors[1], R = PLAN.floors[2];
  const room = (F, n) => F && F.rooms.find(r => r.n === n);
  const front = (F, k) => F.openings.filter(p => p.ax === 'h' && p.at === F.front && p.k === k);
  const { zG, zF, zR, zP, zS, zT } = elevLevels();
  const sx = room(G, 'Side stair').x1, porch = room(G, 'Car porch'), dx0 = room(G, 'Drawing room').x0;
  const balc = room(F1, 'Balcony'), tank = room(R, 'Water tank (above)');
  const towerRooms = R ? R.rooms.filter(r => !r.under && r.t !== 'terrace' && r.t !== 'open') : [];
  const tw0 = towerRooms.length ? Math.min(...towerRooms.map(r => r.x0)) : 0, tw1 = towerRooms.length ? Math.max(...towerRooms.map(r => r.x1)) : sx;
  const L = compact ? 14 : 50, RM = compact ? 46 : 150, T = 30, B = 74, top = zT + 1.2;
  const X = x => L + x * S, Z = z => T + (top - z) * S;
  const width = L + W * S + RM, height = T + top * S + B;
  const BEIGE = '#d8cbb9', GREY = '#85888c', WALL = '#eeece7', DARK = '#2c2e33', GLASS = '#cfe1ea', WOOD = '#c7a47a', LINE = '#3a3d42';
  const o = [];
  const bx = (x0, x1, z0, z1, fill, extra) =>
    `<rect x="${X(x0)}" y="${Z(z1)}" width="${(x1 - x0) * S}" height="${(z1 - z0) * S}" fill="${fill}" ${extra || ''}/>`;
  const tx = (x, z, t, size, fill, extra) =>
    `<text x="${X(x)}" y="${Z(z)}" font-size="${size}" fill="${fill}" text-anchor="middle" font-family="${FONT}" ${extra || ''}>${esc(t)}</text>`;
  const edge = `stroke="${LINE}" stroke-width="1"`;
  const windowAt = (p, z0, z1) => {
    const a = Math.min(p.from, p.to), b = Math.max(p.from, p.to), n = Math.max(2, Math.round((b - a) / 3.5));
    let h = bx(a, b, z0, z1, DARK) + bx(a + .2, b - .2, z0 + .2, z1 - .2, GLASS);
    for (let k = 1; k < n; k++) h += bx(a + (b - a) * k / n - .07, a + (b - a) * k / n + .07, z0, z1, DARK);
    return h + bx(a, b, z0 + (z1 - z0) * .22 - .07, z0 + (z1 - z0) * .22 + .07, DARK);
  };

  o.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" data-elev="1">`);
  o.push(`<rect width="${width}" height="${height}" fill="${PAPER}"/>`);
  o.push(`<text x="${L}" y="18" font-size="14" font-weight="700" fill="${INK}" font-family="${FONT}">FRONT ELEVATION</text>`);
  if (!compact) o.push(`<text x="${width - 8}" y="18" font-size="8.5" fill="#8b9099" text-anchor="end" font-family="${FONT}">seen from the lane, drawn to scale</text>`);

  /* roof structures first, so the parapet covers their feet */
  if (tank) { o.push(bx(tank.x0, tank.x1, zS, zT, '#b9bcc0', edge));
    o.push(tx((tank.x0 + tank.x1) / 2, zS + E.tank / 2 + .5, 'Water', 8, INK)); o.push(tx((tank.x0 + tank.x1) / 2, zS + E.tank / 2 - .4, 'tank', 8, INK)); }
  o.push(bx(tw0, tw1, zR, zS, BEIGE, edge));                                // stair tower, set back from the front
  o.push(tx((tw0 + tw1) / 2, zP + (zS - zP) / 2 - .2, 'Stair tower', 8, INK));

  /* the house */
  o.push(bx(0, W, 0, zR, WALL, edge));
  o.push(bx(0, W, 0, zG, '#b9b4ab'));                                        // plinth
  o.push(bx(0, sx, zG, zR, BEIGE));                                          // stair block, full height

  /* ground floor */
  o.push(bx(dx0, dx0 + .8, zG, zF, GREY) + bx(W - .8, W, zG, zF, GREY));
  for (const p of front(G, 'win')) o.push(windowAt(p, zG + E.groundSill, zG + E.groundHead));
  o.push(bx(porch.x0, porch.x1, zG, zF - E.slab, '#4b4741'));                // looking into the car porch
  o.push(tx((porch.x0 + porch.x1) / 2, zG + E.gate + .9, 'Car porch', 8, '#e9e4da'));
  for (const g of front(G, 'gate')) {
    const a = Math.min(g.from, g.to), b = Math.max(g.from, g.to);
    o.push(bx(a, b, 0, zG, '#c6c1b7'));                                      // steps or ramp up the plinth
    if (b - a < 4) o.push(bx(a, b, zG / 2 - .04, zG / 2 + .04, '#8d8980'));
    o.push(bx(a, b, zG, zG + E.gate, DARK));
    for (let x = a + .3; x < b - .1; x += .3) o.push(`<line x1="${X(x)}" y1="${Z(zG + E.gate) + 2}" x2="${X(x)}" y2="${Z(zG) - 1}" stroke="#474a51" stroke-width=".8"/>`);
    o.push(`<text x="${X((a + b) / 2)}" y="${Z(0) + 14}" font-size="9" fill="${INK}" text-anchor="middle" font-family="${FONT}">${esc(g.label || 'Gate')}</text>`);
  }
  o.push(tx((dx0 + W) / 2, zG + 1.1, 'Drawing room', 8.5, INK));

  /* first floor */
  o.push(bx(0, W, zF - E.slab, zF, '#fbfbf9', `stroke="${LINE}" stroke-width=".6"`));
  o.push(bx(1.4, 2.6, zF + 3, zF + 8, DARK) + bx(1.55, 2.45, zF + 3.15, zF + 7.85, GLASS));     // stair window
  if (balc) {
    o.push(bx(balc.x0, balc.x1, zF, zR - E.slab, '#d3c8b8'));
    o.push(tx((balc.x0 + balc.x1) / 2 + 1.2, zF + 6.2, 'Balcony', 8.5, INK));
    for (let k = 0; k < 6; k++) o.push(bx(balc.x0 + .45 + k * .5, balc.x0 + .63 + k * .5, zF + E.railing, zR - E.slab - .3, WOOD));
    o.push(bx(balc.x0, balc.x1, zF, zF + E.railing, GLASS, `fill-opacity=".65" stroke="${LINE}" stroke-width=".8"`));
    o.push(bx(balc.x0, balc.x1, zF + E.railing - .12, zF + E.railing, '#9aa0a6'));
    o.push(`<rect x="${X(balc.x0 + .3)}" y="${Z(zF + E.railing + .5)}" width="${3.2 * S}" height="${1.3 * S}" rx="7" fill="#6f9a5b"/>`);
  }
  o.push(bx(dx0, W, zF, zR, GREY));
  for (const p of front(F1, 'win')) o.push(windowAt(p, zF + E.firstSill, zF + E.firstHead));
  o.push(tx((dx0 + W) / 2, zF + E.firstHead + .55, 'Drawing room', 8.5, '#f3f3f1'));

  /* roof: slab edge, then a parapet at one height across the full width */
  o.push(bx(0, W, zR - E.slab, zR, '#fbfbf9', `stroke="${LINE}" stroke-width=".6"`));
  o.push(bx(0, W, zR, zP, BEIGE, edge));
  o.push(bx(-.15, W + .15, zP - .3, zP, '#c3b5a1', `stroke="${LINE}" stroke-width=".6"`));
  o.push(tx(W / 2 + sx / 2, zR + E.parapet / 2 - .35, 'Parapet ' + ft(E.parapet) + ' high, all round the roof', 9, INK, 'font-weight="600"'));

  /* the lane */
  o.push(`<rect x="${X(-1.5)}" y="${Z(0)}" width="${(W + 3) * S}" height="5" fill="#c9c5bd"/>`);
  o.push(`<line x1="${X(-1.5)}" y1="${Z(0)}" x2="${X(W + 1.5)}" y2="${Z(0)}" stroke="${LINE}" stroke-width="1.2"/>`);

  /* heights up the right-hand side, measured from the lane */
  const tick = (x, y) => `<line x1="${x - 3}" y1="${y + 3}" x2="${x + 3}" y2="${y - 3}" stroke="${DIM}" stroke-width="1"/>`;
  const rx = X(W) + 16;
  const levels = [[0, 'Lane'], [zG, 'Ground floor'], [zF, 'First floor'], [zR, 'Roof'], [zP, 'Parapet top'], [zS, 'Stair tower top'], [zT, 'Tank top']];
  o.push(`<line x1="${rx}" y1="${Z(0)}" x2="${rx}" y2="${Z(zT)}" stroke="${DIM}" stroke-width="1"/>`);
  for (const [z, name] of levels) {
    o.push(tick(rx, Z(z)));
    o.push(`<text x="${rx + 8}" y="${Z(z) + 3}" font-size="${compact ? 10 : 9}" fill="${DIM}" font-family="${FONT}">${esc(z ? ft(z) : '0')}${compact ? '' : ' · ' + esc(name)}</text>`);
  }
  /* widths along the bottom */
  const by = Z(0) + 36, xs = [0, sx, dx0, W];
  o.push(`<line x1="${X(0)}" y1="${by}" x2="${X(W)}" y2="${by}" stroke="${DIM}" stroke-width="1"/>`);
  xs.forEach((v, k) => { o.push(tick(X(v), by));
    if (k) o.push(`<text x="${(X(v) + X(xs[k - 1])) / 2}" y="${by - 4}" font-size="${compact ? 10.5 : 9}" fill="${DIM}" text-anchor="middle" font-family="${FONT}">${esc(ft(v - xs[k - 1]))}</text>`); });
  o.push(`<text x="${(X(0) + X(W)) / 2}" y="${by + 14}" font-size="${compact ? 10.5 : 9}" fill="${DIM}" text-anchor="middle" font-family="${FONT}">${esc(ft(W))} overall</text>`);
  o.push('</svg>');
  return o.join('');
}

/* ==========================================================================
   ROOM DETAILS SHEET
   ========================================================================== */
function infoFor(fi, r) {
  const d = PLAN.details, a = d[r.n] || {}, b = d[r.n + '@' + fi] || {};
  const notes = [...(a.notes || []), ...(b.notes || [])];
  const bath = a.bath || b.bath;
  if (bath) notes.push(...PLAN.bathNotes);
  return {
    ceil:  b.ceil || a.ceil || (bath ? "7'6\" above the bathing floor, 6'6\" over the toilet platform"
                                     : r.t === 'stair' ? 'Open to the stair above' : r.t === 'terrace' ? 'Open to the sky' : "9'6\" clear (10' floor to floor)"),
    level: b.level || a.level || (bath ? 'Bathing floor at the lower level; toilet platform about 1 ft higher'
                                       : PLAN.floors[fi].levelText || (fi === 0 ? "Ground floor level, 1'6\" above the lane" : "First floor level, 10' above the ground floor")),
    notes
  };
}
function describe(p, name) {
  const other = p.j.find(n => n !== name) || p.j[0], w = ft(Math.abs(p.to - p.from));
  if (p.k === 'door') return `${p.label || 'Door'}, ${w} wide, to ${other}`;
  if (p.k === 'gate') return `${p.label || 'Gate'}, ${w} wide, to ${other}`;
  if (p.k === 'open') return `${p.label || 'Open'}, ${w} wide, to ${other}`;
  if (p.k === 'rail') return `Railing, ${w} long, facing ${other}`;
  return `${p.label || 'Window'}, ${w} wide, onto ${other}`;
}
function renderRoom() {
  const F = PLAN.floors[selF], r = F.rooms[selR];
  if (!r) return '';
  const b = box(r), m = 2.5, lowest = Math.min(0, ...PLAN.floors.map(f => f.front));
  const x0 = Math.max(-1.6, b.x0 - m), x1 = Math.min(PLAN.plot.w + 1.6, b.x1 + m);
  const y0 = Math.max(lowest - 1.6, b.y0 - m), y1 = Math.min(PLAN.plot.d + 1.6, b.y1 + m);
  const crop = { x: PX(x0), y: PY(y1), w: (x1 - x0) * S, h: (y1 - y0) * S };
  const svg = drawFloor(selF, { detail: selR, crop, fs: clamp(crop.w / 290, 0.55, 1) });
  const c = clearOf(F, r), info = infoFor(selF, r);
  const ops = (F.openings || []).filter(p => p.j && p.j.includes(r.n));
  const doors = ops.filter(p => p.k !== 'win' && p.k !== 'rail').map(p => describe(p, r.n));
  const wins  = ops.filter(p => p.k === 'win' || p.k === 'rail').map(p => describe(p, r.n));
  const FXN = { commode:'Commode', asian:'Asian toilet', basin:'Basin', shower:'Shower', platform:'Raised platform for the toilets',
                tank:'Underground water tank, 3,000 gallons', wash:'Washing area with space for a washing machine',
                bed:"Double bed, 5' × 6'6\"", side:'Side tables', wardrobe:'Wardrobe, 2 ft deep', dresser:'Dressing table with stool',
                sofa:'Sofa', chair:'Armchair', table:'Low table', dining:'Dining table for four', tv:'TV unit',
                counter:'Counters, 2 ft deep', sink:'Sink', hob:'Hob', fridge:'Fridge' };
  const fx = [...new Set((F.fixtures || []).filter(x => x.r === r.n).map(x => FXN[x.k]).filter(Boolean))];
  const ul = a => a.length ? `<ul>${a.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : '<span style="color:#8b9099">None</span>';
  const row = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
  return `<div class="sheet wide"><div class="detail">` +
    `<div class="pic">${svg}</div>` +
    `<div class="facts"><h2>${esc(r.n)}</h2><div class="where">${esc(F.name)}` +
      (r.under ? ' · ' + (r.where || 'under the stair') : '') + `</div>` +
      `<p style="margin:0 0 10px"><button class="btn" id="back">Back to the floor plan</button></p><table>` +
      row('Clear size', `<b>${esc(ft(c.w))} × ${esc(ft(c.h))}</b> &nbsp;(${Math.round(c.w * c.h)} sq ft)`) +
      row('To wall centres', `${esc(ft(b.x1 - b.x0))} × ${esc(ft(b.y1 - b.y0))}`) +
      row('Height', esc(info.ceil)) +
      row('Floor level', esc(info.level)) +
      row('Doors and openings', ul(doors)) +
      row('Windows', ul(wins)) +
      (fx.length ? row('Fittings and furniture', ul(fx)) : '') +
      (info.notes.length ? row('Notes', ul(info.notes)) : '') +
    `</table></div></div></div>`;
}

/* ==========================================================================
   AREAS AND CHECKS
   ========================================================================== */
function floorStats(fi) {
  const F = PLAN.floors[fi], W = PLAN.plot.w, D = PLAN.plot.d;
  const by = { room:0, wet:0, stair:0, porch:0, balcony:0, open:0, terrace:0 };
  const solid = F.rooms.filter(r => !r.under);
  for (const r of solid) by[r.t in by ? r.t : 'room'] += area(r);
  const c = 0.25; let gap = 0, over = 0;                 // sample a 3 in grid
  for (let x = c / 2; x < W; x += c) for (let y = F.front + c / 2; y < D; y += c) {
    let n = 0;
    for (const r of solid)
      if (x > Math.min(r.x0, r.x1) && x < Math.max(r.x0, r.x1) &&
          y > Math.min(r.y0, r.y1) && y < Math.max(r.y0, r.y1)) n++;
    if (n === 0) gap++; else if (n > 1) over++;
  }
  let usable = 0; const narrow = [];
  for (const r of solid) {
    const cl = clearOf(F, r);
    if (r.t === 'room' || r.t === 'wet') usable += cl.w * cl.h;
    if (r.t === 'stair' && (r.treads | 0) > 0) {
      const across = (r.dir || '+Y').charAt(1) === 'Y' ? cl.w : cl.h;
      if (across < 3 - 0.01) narrow.push(across);
    }
  }
  return { by, gap: gap * c * c, over: over * c * c, usable, narrow,
           covered: by.room + by.wet + by.stair + by.balcony };
}
function renderSum() {
  const r0 = n => Math.round(n).toLocaleString();
  let html = '', total = 0;
  PLAN.floors.forEach((F, fi) => {
    const s = floorStats(fi);
    if (F.roof) {
      html += `<div class="sum" style="margin-bottom:10px"><div><b>${esc(F.name)}</b><span>${ft(PLAN.plot.w)} × ${ft(PLAN.plot.d - F.front)}</span></div>` +
        `<div><span>Stair tower</span><b>${r0(s.by.stair + s.by.room)} sq ft</b></div>` +
        `<div><span>Open terrace</span><b>${r0(s.by.terrace)} sq ft</b></div>` +
        `<div><span>Air duct</span><b>${r0(s.by.open)} sq ft</b></div>` +
        `<div><span>Water tank, on top of the stair tower</span><b>1,000 gallons</b></div>` +
        ((s.gap > 0.5 || s.over > 0.5) ? `<div class="chk bad">Check: the roof outline has a gap or an overlap.</div>` : '') + `</div>`;
      return;
    }
    total += s.covered;
    html += `<div class="sum" style="margin-bottom:10px"><div><b>${esc(F.name)}</b><span>${ft(PLAN.plot.w)} × ${ft(PLAN.plot.d - F.front)}</span></div>` +
      `<div><span>Rooms and baths</span><b>${r0(s.by.room + s.by.wet)} sq ft</b></div>` +
      `<div><span>Stair</span><b>${r0(s.by.stair)} sq ft</b></div>` +
      (s.by.balcony ? `<div><span>Balcony</span><b>${r0(s.by.balcony)} sq ft</b></div>` : '') +
      (s.by.porch ? `<div><span>Car porch (not counted)</span><b>${r0(s.by.porch)} sq ft</b></div>` : '') +
      `<div><span>Open court (not counted)</span><b>${r0(s.by.open)} sq ft</b></div>` +
      `<div class="tot"><span>Covered area</span><b>${r0(s.covered)} sq ft</b></div>` +
      `<div><span>Usable floor inside rooms, after walls</span><b>${r0(s.usable)} sq ft</b></div>`;
    const bad = [];
    if (s.gap > 0.5)  bad.push(`${r0(s.gap)} sq ft of the floor belongs to no room`);
    if (s.over > 0.5) bad.push(`${r0(s.over)} sq ft is claimed by two rooms`);
    if (s.narrow.length) bad.push(`the stair is only ${esc(ft(Math.min(...s.narrow)))} wide between the walls (aim for 3' or more)`);
    html += bad.length ? `<div class="chk bad">Check: ${bad.join('; ')}.</div>`
                       : `<div class="chk ok">Rooms fill the floor exactly, with no gaps or overlaps.</div>`;
    html += '</div>';
  });
  html += `<div class="sum"><div class="tot"><span><b>Total covered, both floors</b></span><b>${r0(total)} sq ft</b></div></div>` +
          `<p class="hint">Walls: ${PLAN.walls.outer} in outside and ${PLAN.walls.inner} in inside, finished with plaster.</p>`;
  $('sum').innerHTML = html;
}

  } else if (view === 'room') {
    d.innerHTML = renderRoom();
  } else {
    const list = view === 'both' ? PLAN.floors.map((_, i) => i) : [view];
    d.innerHTML = list.map(i => `<div class="sheet">${drawFloor(i)}` +
      (compact ? '<p class="hint" style="text-align:center;margin:4px 0 6px">Tap a room to see its sizes and details.</p>' : '') + `</div>`).join('');
  }
  /* shorter tab names on a phone so all five fit on one row */
  const vs = compact
    ? [['both', 'All'], ...PLAN.floors.map((f, i) => [i, f.name.split(' ')[0]]), ['room', 'Rooms'], ['elev', 'Elevation']]
    : [['both', 'All floors'], ...PLAN.floors.map((f, i) => [i, f.name]), ['room', 'Room details'], ['elev', 'Elevation']];
  $('png').textContent = compact ? 'Save picture' : 'Save as picture (PNG)';
  $('views').innerHTML = vs.map(([v, l]) => `<button data-v="${v}" class="${String(v) === String(view) ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('rooms').innerHTML = PLAN.floors.map((F, fi) =>
    `<h3>${esc(F.name)}</h3><div class="list">` + F.rooms.map((r, i) => r.quiet ? '' :
      `<button data-f="${fi}" data-i="${i}" class="${view === 'room' && fi === selF && i === selR ? 'on' : ''}">${esc(r.n)}</button>`).join('') +
    `</div>`).join('');
}
function openRoom(f, i) { selF = f; selR = i; view = 'room'; render(); window.scrollTo(0, 0); }

$('views').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  const v = b.dataset.v; view = (v === 'both' || v === 'elev' || v === 'room') ? v : +v; render(); };
$('rooms').onclick = e => { const b = e.target.closest('button'); if (b) openRoom(+b.dataset.f, +b.dataset.i); };
$('draw').onclick = e => {
  if (e.target.id === 'back') { view = selF; render(); window.scrollTo(0, 0); return; }
  const t = e.target.closest('[data-i]'); if (t) openRoom(+t.dataset.f, +t.dataset.i); };

/* save what is on screen as PNG, one file per drawing */
$('png').onclick = () => {
  const svgs = [...document.querySelectorAll('#draw svg')];
  if (!svgs.length) { alert('Switch to a plan or a room first.'); return; }
  svgs.forEach(svg => {
    const fi = +svg.dataset.floor, isElev = !!svg.dataset.elev, w = svg.viewBox.baseVal.width, h = svg.viewBox.baseVal.height, k = 3;
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type:'image/svg+xml' }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = w * k; c.height = h * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const a = document.createElement('a');
      const base = isElev ? 'front-elevation' : view === 'room' ? PLAN.floors[selF].rooms[selR].n + '-' + PLAN.floors[selF].name : 'plan-' + PLAN.floors[fi].name;
      a.download = base.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png';
      a.href = c.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove();
    };
    img.src = url;
  });
};

$('sub').textContent = `${PLAN.plot.w} × ${PLAN.plot.d} ft · ground + 1`;
$('notes').innerHTML = PLAN.notes.map(n => `<li>${esc(n)}</li>`).join('');
const phone = matchMedia('(max-width: 640px)');
setCompact(phone.matches);
if (compact) view = 0;                    // one floor at a time on a phone
addEventListener('resize', () => { if (phone.matches !== compact) { setCompact(phone.matches); render(); } });
renderSum();
render();
</script>
